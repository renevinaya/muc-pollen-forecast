[project]
name = "muc-pollen-forecast"
version = "2.0.0"
description = "ML-based seven-day, 3-hourly pollen forecast for Munich using XGBoost"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.28",
    "pandas>=3.0",
    "numpy>=2.5",
    "xgboost>=3.4",
    "scikit-learn>=1.9",
    "joblib>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
]

[project.scripts]
muc-pollen-forecast = "src.main:main"

[tool.uv]
# Exclude nvidia-nccl: a ~290MB GPU multi-node library pulled in by xgboost and
# unnecessary for CPU-only inference. Both CUDA majors are listed because
# xgboost switched from the cu12 build to cu13, which silently reintroduced it.
override-dependencies = [
    "nvidia-nccl-cu12; sys_platform == 'win32'",
    "nvidia-nccl-cu13; sys_platform == 'win32'",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, which widen between
# releases: 0.16 added ~43 findings to this codebase without a line changing.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# The package is imported as ``src.*`` and is not installed into the
# environment, so the repository root has to be on the path.
pythonpath = ["."]
testpaths = ["tests"]
